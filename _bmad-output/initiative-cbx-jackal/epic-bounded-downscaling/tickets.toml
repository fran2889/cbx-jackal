[[entry]]
id = 8
type = "story"
title = "Geometry: dimensions, orientation, the box and the spread test"
description = "Reads every SOF marker for coded dimensions and APP1 EXIF orientation across both TIFF endians and all eight values, derives the display box, tests for a spread on DISPLAY aspect only at 1.35:1, and computes the target box preserving aspect. Stdlib only, no subprocess. Creates cbx_jackal/geometry.py."
verify = "Unit tests over the entry 2 fixtures agree with `magick -auto-orient -format %wx%h` for the same file, and the tagged-sideways fixture is not exempt while the untagged one is."
covers = ["R1"]
after = [2, 7]
hitl = false
risk = "medium"

[[entry]]
id = 9
type = "story"
title = "Resize: the magick invocation hardened"
description = "Carries the spike's invocation to the full contract: the trailing > as an explicit downsize guard, -auto-orient, -quality with the confirmed value, the target box supplied by entry 8 so magick has no fit decision left to make, temp file discipline and cleanup on every exit path matching encode.run, and magick's non-zero exit as the not-converted oracle per entry 4's vocabulary. Creates cbx_jackal/resize.py."
verify = "A magick failure on one page leaves that page copied through under its original name with its own report line and a non-zero exit, no temp file survives any exit path, and the intermediate is encoded at the confirmed quality with the confirmed interaction against run-level --quality."
covers = ["R1"]
after = [8]
hitl = false
risk = "medium"
unknown = "The intermediate's format and quality are undecided and must be settled with investigation before this entry starts. Three routes were measured on a 1700x2400 synthetic comic page, comparing the final .jxl against the source's own decoded pixels: JPEG q92 loses 364,021 pixels (8.9%) and yields a 26,837-byte .jxl at 0.047 s/page; JPEG q100 loses 145,218 (3.6%) and yields 41,286 bytes at the same speed; a PNG intermediate with cjxl -q 100 loses zero and yields 27,784 bytes at 0.29 s/page. PPM and PAM measured identically to PNG. See this epic's Notes for the three consequences a lossless intermediate would force."

[[entry]]
id = 10
type = "story"
title = "Report: downscaled, the exemption line, and the run-level mode line"
description = "Adds the per-page downscaled state, the exemption line and the summary counts that entry 4 fixed, folding losslessness into the one place report.py decides it rather than adding a third site. AGENTS.md records that render() currently claims 'lossless (JPEG bytes recoverable with djxl)' whenever quality is None, which is false for every downscaled page."
verify = "A mixed book reports per-page downscaled dimensions, names every spread exempted from the width rule, states that a downscaled page is recoverable from the intermediate only, and no longer claims the run is byte-recoverable when any page was downscaled; a page inside the box still reads as byte-recoverable."
covers = ["R1"]
after = [4, 9]
hitl = false
risk = "medium"

[[entry]]
id = 11
type = "story"
title = "CLI: --max-width, --max-height, validation and the epilog"
description = "The two flags with the validation entry 3 fixed and the conditional preflight entry 5 fixed, reaching the report entry 10 made able to state a downscale. The epilog covers the box, the intermediate, and which tool each run needs."
verify = "cbx-jackal --max-width 1600 on a book downsizes the oversized pages; with magick absent and a box requested it exits 2 before any archive opens, naming magick, in one message; with magick absent and no box it runs normally and never checks for it; and with no box at all the run is byte-for-byte the run it is today."
covers = ["R1"]
after = [3, 5, 10]
hitl = false
risk = "medium"

