after = []
hitl = true
risk = "low"

[[entry]]
id = 6
type = "story"
title = "Contract: the classification gate, with a stub"
description = "The interface at archive.py:66-95 that separates a raw page from an archive entry, extended so a source that is not a ZIP can be represented, with a stub epic-archive-containers can fill. Implements the naming rule entry 3 fixes. Records the ruling in this epic's envelope."
verify = "The interface is written down and the stub classifies a page, a resource fork, a directory and a source whose container it does not recognise, without naming any real archiver."
