# tickets.toml — epic-bounded-downscaling. Entry ids are stable: epic-webp-target,
# epic-quality-audit and epic-archive-containers name 1.3, 1.4, 1.5 and 1.6 as the providers they wait on.

[[entry]]
id = 1
type = "spike"
title = "De-risk the chain and build the fixture injector"
description = "Proves byte-injected orientation bytes to a downscaled page in a published archive, through the existing Converter with the box passed programmatically. Keeps the EXIF APP1 injector, because the ImageMagick build in use cannot write an orientation tag and every later fixture needs it; throws away the rest of the chain."
verify = "A synthetic book with one oversized tagged page converts via Converter called directly, that page downscaled against its display width, and the injector writes a tag ImageMagick then reads back."
covers = []
after = []
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Fixtures: the full set"
description = "Every classification the geometry and report entries assert has a named fixture: all eight orientation values, both TIFF endians, a recognised spread at and beyond 1.35:1, a near-miss below it, a landscape splash page the exemption will misread, and a page scanned sideways carrying no tag. Generated bytes only, so nothing here waits on code."
verify = "Every fixture is generated by make_fixtures.py, is byte-stable on a second run, and the suite reports zero skips with cjxl, djxl, jxlinfo and magick all on PATH."
covers = ["R1"]
after = [1]
hitl = false
risk = "low"

[[entry]]
