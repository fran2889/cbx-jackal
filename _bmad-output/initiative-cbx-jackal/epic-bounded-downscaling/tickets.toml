type = "story"
title = "Contract: destination naming and the flag namespace"
description = "Fixes the destination name across formats, geometry and input containers, and where --format, --max-width, --max-height and --quality live and which apply where. --max-width and --max-height are combinable, per CAP-6's and/or; this entry must say so explicitly rather than leave mutual exclusion open. Records the ruling in this epic's envelope, not in the spec."
verify = "The rules are written down and a reader can name the output of any combination of format, box and input container without asking."
covers = ["R1"]
after = []
hitl = true
risk = "low"

[[entry]]
