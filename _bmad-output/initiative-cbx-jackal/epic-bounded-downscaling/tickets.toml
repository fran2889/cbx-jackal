[[entry]]
id = 7
type = "story"
title = "Apply the approved change proposal to the spec and the frozen plan block"
description = "Sections 4.1 to 4.7 through bmad-spec into spec-cbz-jxl and BOTH companions, carrying whatever entries 3 to 6 changed; section 4.8 by hand into plan-cbz-jxl.md's frozen block, which no skill owns. Unblocks every code entry, which all cite CAP-6."
verify = "The spec carries CAP-1's per-page wording, CAP-6, the amended non-goals, constraints, success signal and assumptions; entry-transformations.md carries the four new rows and the summary format; conventions.md carries the Resizing section, the jxlinfo amendment, the preflight paragraph and the two-row install table; and the frozen block no longer forbids resize."
covers = ["R1"]
