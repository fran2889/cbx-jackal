[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbx-jackal"
version = "0.1.0"
description = "Transcode CBZ comic pages to JPEG XL losslessly and byte-reversibly."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
keywords = ["cbz", "comic", "jpeg-xl", "jxl", "lossless", "transcode"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

# No runtime dependencies, deliberately. Container handling is the Python
# standard library only -- no Python imaging libraries -- and cjxl is an
# external tool that is never bundled. Keeping this list empty is what lets the
# tests run on stdlib unittest alone.
dependencies = []

[project.scripts]
cbx-jackal = "cbx_jackal.cli:main"

[tool.setuptools]
packages = ["cbx_jackal"]
